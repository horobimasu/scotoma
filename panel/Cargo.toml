[package]
name = "builder"
version = "2.5.0"
edition = "2024"

[profile.release]
opt-level = 3
debug = "none"
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 128

[dependencies]
axum = "0.8.9"

[dependencies.tokio]
version = "1.52.3"
features = ["rt-multi-thread"]

[dependencies.tower-http]
version = "0.6.10"
features = ["fs"]

[dependencies.shared]
path = "../shared"

[dependencies.serde_json]
version = "1.0.149"
default-features = false
