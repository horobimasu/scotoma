[package]
name = "encryptor"
version = "2.4.1"
edition = "2024"

[profile.release]
opt-level = 3
debug = "none"
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1

[dependencies]
rayon = "1.12.0"

[dependencies.shared]
path = "../shared"
